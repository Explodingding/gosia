name: Daily naboru run

on:
  schedule:
    # Codziennie o 6:00 UTC = 7:00 PL (zima) / 8:00 PL (lato)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (nie zapisuj do bazy, nie wysylaj maila)"
        required: false
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
      mail_always:
        description: "Wyslij mail nawet gdy 0 nowych naborow"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

concurrency:
  group: daily-nabory
  cancel-in-progress: false

jobs:
  run:
    name: Skanowanie i mail
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'no' }}
          MAIL_ALWAYS: ${{ github.event.inputs.mail_always || 'no' }}
          MAX_ENRICH_PER_RUN: "80"
          TZ: Europe/Warsaw
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: "1"
        run: |
          python -m nabory.main

      - name: Upload screenshots i logi przy bledzie
        if: failure() || always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            artifacts/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  sheet-back-sync:
    name: Synchronizacja decyzji z arkusza
    runs-on: ubuntu-latest
    needs: run
    if: always() && github.event_name == 'schedule'
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Apply Sheet -> Supabase decisions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TZ: Europe/Warsaw
        run: |
          python -m nabory.sinks.sheets sync-decisions
