[project]
name = "nabory"
version = "0.1.0"
description = "Agent codziennego monitoringu naborow funduszy unijnych dla InwestycjePomorze.pl"
requires-python = ">=3.11"
authors = [
    { name = "InwestycjePomorze.pl" },
]
dependencies = [
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.2",
    "tenacity>=9.0.0",
    "httpx>=0.27.2",
    "selectolax>=0.3.27",
    "playwright>=1.49.0",
    "feedparser>=6.0.11",
    "pdfplumber>=0.11.4",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "openai>=1.55.0",
    "supabase>=2.10.0",
    "gspread>=6.1.4",
    "google-auth>=2.36.0",
    "resend>=2.5.0",
    "jinja2>=3.1.4",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
]

[project.scripts]
nabory-run = "nabory.main:main"
nabory-sheet-sync = "nabory.sinks.sheets:sync_cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]
